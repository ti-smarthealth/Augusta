name: Deploy OCR Lambda

on:
  push:
    branches: [main]
    paths:
      - 'ocr/**'
      - '.github/workflows/deploy-ocr.yml'
  # The first image has to exist before `ocr/provision.sh phase2` can create
  # the function around it, so this is also runnable by hand from the Actions
  # tab. See ocr/README.md §Provisioning.
  workflow_dispatch:

# OIDC: the workflow exchanges a GitHub-signed token for short-lived AWS
# credentials by assuming an IAM role — no long-lived AWS keys are stored in
# GitHub. One-time setup: tish-app/backend/DEPLOY.md
permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: tish-ocr
  FUNCTION_NAME: tish-ocr

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        # Deploy gate, as every other Lambda here has. Only the pure row
        # grouping is tested — it needs no model, no image and no network.
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # **x86_64, not arm64 — and not for want of trying.** The first build was
      # arm64 under QEMU, for the Graviton rate every other Lambda here gets.
      # It aborted on every invocation (2026-09-22): onnxruntime's CPU
      # detection (pytorch/cpuinfo) reads /sys/devices/system/cpu/possible,
      # which Lambda's arm64 sandbox does not provide, and the failure is a
      # C++ terminate() before Python can catch anything. On x86 that library
      # uses CPUID and never touches sysfs. The runner is x86 too, so no
      # emulation: the build is minutes faster as a side effect.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            --push .
          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # **Updates only, never creates** — the same rule as deploy-backend.yml.
      # If the function does not exist yet this step fails, and that is the
      # cue to run `ocr/provision.sh phase2`, which creates it from the
      # `:latest` image this run just pushed. `--provenance=false` above
      # matters: Lambda rejects the attestation manifest buildx attaches by
      # default ("image manifest media type not supported").
      #
      # `--architectures` is stated on every update so the function can never
      # drift from the image: it is what moved the live function from arm64
      # to x86_64 when the platform above changed.
      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.build.outputs.image }}" \
            --architectures x86_64 \
            --publish
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
